<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Rook Practice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: #f4f7f8;
      color: #173b47;
      font: 16px/1.5 Inter, system-ui, sans-serif;
    }
    main { width: min(100%, 1100px); margin: 0 auto; }
    header { padding: 0.5rem 0 1rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    p { margin: 0; color: #687386; }
    iframe {
      display: block;
      width: 100%;
      height: max(900px, calc(100vh - 110px));
      border: 1px solid #dce5e8;
      border-radius: 12px;
      background: #fff;
    }
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      iframe { height: 1300px; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Private Rook Practice</h1>
      <p>Practice hands, rig a grand slam test deal, or reuse a deal code.</p>
    </header>
    <iframe id="practiceGame" src="rook.html?embed=1&amp;localPractice=1" title="Rook practice game"></iframe>
  </main>
</body>
</html>
